# Builds libtailscale.aar on Ubuntu (no local Go/NDK on Windows required)
# and commits app/libs/libtailscale.aar back to the triggering branch.

name: Build libtailscale AAR

on:
  workflow_dispatch:
    inputs:
      tailscale_android_ref:
        description: tailscale-android git ref (branch or tag)
        required: false
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/build-libtailscale.sh'
      - '.github/workflows/build-tailscale.yml'
  schedule:
    # Weekly refresh against tailscale-android main (Monday 06:00 UTC)
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: build-tailscale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-commit-aar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      TAILSCALE_ANDROID_REF: ${{ github.event.inputs.tailscale_android_ref || 'main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make zip unzip curl

      - name: Cache tailscale-android clone
        uses: actions/cache@v4
        with:
          path: .tailscale-android-src
          key: tailscale-android-src-${{ env.TAILSCALE_ANDROID_REF }}-${{ hashFiles('scripts/build-libtailscale.sh') }}
          restore-keys: |
            tailscale-android-src-${{ env.TAILSCALE_ANDROID_REF }}-
            tailscale-android-src-

      - name: Cache Android SDK (NDK + platform)
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: android-sdk-ndk23-${{ runner.os }}-${{ hashFiles('scripts/build-libtailscale.sh') }}
          restore-keys: |
            android-sdk-ndk23-${{ runner.os }}-

      - name: Build libtailscale.aar
        run: |
          chmod +x scripts/build-libtailscale.sh
          ./scripts/build-libtailscale.sh

      - name: Verify AAR artifact
        run: |
          test -f app/libs/libtailscale.aar
          ls -lh app/libs/libtailscale.aar
          unzip -l app/libs/libtailscale.aar | head -20

      - name: Commit and push libtailscale.aar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs/libtailscale.aar
          if git diff --staged --quiet; then
            echo "libtailscale.aar unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(ci): update libtailscale.aar from tailscale-android ${TAILSCALE_ANDROID_REF}"
          git push
